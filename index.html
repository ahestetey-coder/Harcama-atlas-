<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Aylık gider takibi — veriler yalnızca bu cihazda." />
    <title>%APP_NAME%</title>
    <script>
      // Tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler). Yalnızca arayüz tercihidir.
      ;(function () {
        try {
          var p = localStorage.getItem('ha:theme') || 'system'
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bu uygulama için JavaScript gereklidir.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
